    <text
       xml:space="preserve"
       transform="scale(0.26458333)"
       id="text12376"
       style="font-size:10.6667px;line-height:1.25;font-family:sans-serif;white-space:pre;shape-inside:url(#rect12378);display:inline"><tspan
         x="557.9082"
         y="183.97099"
         id="tspan15127">actual data model </tspan><tspan
         x="557.9082"
         y="197.30436"
         id="tspan15129">representing a plain C++ </tspan><tspan
         x="557.9082"
         y="210.63774"
         id="tspan15131">class subject to our domain </tspan><tspan
         x="557.9082"
         y="223.97111"
         id="tspan15133">specific annotations. This </tspan><tspan
         x="557.9082"
         y="237.30449"
         id="tspan15135">used to be DaStGen before </tspan><tspan
         x="557.9082"
         y="250.63786"
         id="tspan15137">iwe moved the new features </tspan><tspan
         x="557.9082"
         y="263.97124"
         id="tspan15139">into LLVM.</tspan></text>
    <text
       xml:space="preserve"
       transform="matrix(0.26458333,0,0,0.26458333,-111.73232,1.0134804)"
       id="text12376-2"
       style="font-size:10.6667px;line-height:1.25;font-family:sans-serif;white-space:pre;shape-inside:url(#rect12378-2);display:inline"><tspan
         x="557.9082"
         y="183.97099"
         id="tspan15141">Any DoF in Peano is </tspan><tspan
         x="557.9082"
         y="197.30436"
         id="tspan15143">associated with a mesh </tspan><tspan
         x="557.9082"
         y="210.63774"
         id="tspan15145">entity. This is encoded in this </tspan><tspan
         x="557.9082"
         y="223.97111"
         id="tspan15147">class. Any DoF also has to </tspan><tspan
         x="557.9082"
         y="237.30449"
         id="tspan15149">have some h and x debug </tspan><tspan
         x="557.9082"
         y="250.63786"
         id="tspan15151">info, but we leave it to he </tspan><tspan
         x="557.9082"
         y="263.97124"
         id="tspan15153">subclass to provide this.</tspan></text>
