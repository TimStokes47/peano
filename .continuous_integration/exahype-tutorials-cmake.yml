exahype-tutorials-cmake:
  stage: tutorials
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: build-cmake
  parallel: !reference [.images, parallel]
    matrix:
    - tutorial: [euler, acoustic-wave, elastic-wave, advection, swe]
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/$IMAGE_TAG bash <<< "cd build/tutorials/exahype2/$tutorial; python3 $tutorial.py"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/$IMAGE_TAG bash <<< "cd build/tutorials/exahype2/$tutorial; make -j $(nproc --all)"
  retry: 0
