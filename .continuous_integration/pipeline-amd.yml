amd-build:
  stage: build
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  script:
    - pwd
    - ls
    - whoami
    - hostname
    - echo $SINGULARITY_CACHEDIR
    - echo $CI_COMMIT_SHA
    - echo $CI_COMMIT_BRANCH
    - echo "Running CI with $(nproc) cores"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} python3 configure.py -cc=amdclang -cxx=amdclang++ --exahype --swift --petsc --multithreading=omp
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} make -j $(nproc --all)
  artifacts:
    paths:
      - ./*
    exclude:
      - ".git*"
      - ".git/**/*"
    expire_in: 2 hours
  retry: 0

amd-test:
  stage: test
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: amd-build
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} make check
  retry: 0

amd-tutorials:
  stage: tutorials
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: amd-build
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd tutorials/exahype2/euler; python3 euler.py'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd tutorials/exahype2/euler; make -j'

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd tutorials/exahype2/acoustic-wave; python3 acoustic-wave.py'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd tutorials/exahype2/acoustic-wave; make -j'

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd tutorials/exahype2/elastic-wave; python3 elastic-wave.py'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd tutorials/exahype2/elastic-wave; make -j'

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd tutorials/exahype2/advection; python3 advection.py'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd tutorials/exahype2/advection; make -j'
  retry: 0

amd-applications:
  stage: applications
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: amd-build
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd applications/exahype2/euler; python3 euler.py --no-make --executable=euler'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd applications/exahype2/euler; make -j'

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd applications/exahype2/acoustic-wave; python3 acoustic-wave.py --no-make --executable=acoustic-wave'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd applications/exahype2/acoustic-wave; make -j'

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd applications/exahype2/elastic-wave; python3 elastic-wave.py --no-make --executable=elastic-wave'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd applications/exahype2/elastic-wave; make -j'

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd applications/exahype2/advection; python3 advection.py --no-make --executable=advection'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd applications/exahype2/advection; make -j'
  retry: 0

amd-benchmarks:
  stage: benchmarks
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: amd-build
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd benchmarks/exahype2/euler/kernel-benchmarks; python3 kernel-benchmarks-fv-rusanov.py --no-make --executable=kernel-benchmarks'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} bash <<< 'cd benchmarks/exahype2/euler/kernel-benchmarks; make -j'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${AMD_IMAGE_TAG} benchmarks/exahype2/euler/kernel-benchmarks/kernel-benchmarks
  retry: 0
