include:
  - .continuous_integration/gitlab-templates.yml

stages:
  - Build
  - Test
  - Tutorials
  - Applications
  - Benchmarks

Build:
  extends: .BeforeScript
  stage: Build
  allow_failure: false
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} python3 -m compileall -f ./
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "mkdir build; cd build; CCACHE_DIR=${CCACHE_DIR} CC=${CC} CXX=${CXX} cmake .. ${CONFIGURATION_OPTIONS}"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd build; CCACHE_DIR=${CCACHE_DIR} make -j $(nproc --all)"
    - mv build/src/unittests/CTestTestfile.cmake build/CTestTestfile.cmake
  artifacts:
    paths:
      - ./build/*
    expire_in: 2 hours
  retry: 1

UnitTests:
  extends:
    - .BeforeScript
    - .SanitiseCMake
  stage: Test
  allow_failure: false
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd build; ctest --no-compress-output --output-on-failure"
  needs:
    - job: Build
  dependencies:
    - Build
  retry: 1

MGHyPE:
  extends:
    - .BeforeScript
    - .SanitiseCMake
    - .RunOnlyOnDevelopmentBranches
  stage: Test
  allow_failure: false
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/multigrid/matrixfree/poisson/; PYTHONPATH=$PYTHONPATH:$CI_PROJECT_DIR/python:$CI_PROJECT_DIR/src python3 dg.py -m release; ./peano4matrixfree"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/multigrid/matrixfree/poisson/; PYTHONPATH=$PYTHONPATH:$CI_PROJECT_DIR/python:$CI_PROJECT_DIR/src python3 cg.py -m release; ./peano4matrixfree"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/multigrid/matrixfree/poisson/; PYTHONPATH=$PYTHONPATH:$CI_PROJECT_DIR/python:$CI_PROJECT_DIR/src python3 cg-multigrid.py -m release; ./peano4matrixfree"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/multigrid/matrixfree/poisson/; PYTHONPATH=$PYTHONPATH:$CI_PROJECT_DIR/python:$CI_PROJECT_DIR/src python3 dg-two-grid.py -m release; ./peano4matrixfree"
  needs:
    - job: Build
  dependencies:
    - Build
  retry: 1

ExaHyPE2:
  extends:
    - .BeforeScript
    - .SanitiseCMake
    - .RunOnlyOnDevelopmentBranches
  stage: Tutorials
  allow_failure: false
  parallel:
    matrix:
    - tutorial: [euler, acoustic, elastic, advection, swe]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tutorials/exahype2/toyproblems/$tutorial; CCACHE_DIR=${CCACHE_DIR} PYTHONPATH=$CI_PROJECT_DIR/python python3 $tutorial.py;"
  needs:
    - job: Build
  dependencies:
    - Build
  retry: 1

ExaHyPE2_Euler:
  extends:
    - .BeforeScript
    - .SanitiseCMake
    - .RunOnlyOnDevelopmentBranches
  stage: Applications
  allow_failure: false
  parallel:
    matrix:
    - dimensions: [2, 3]
      build_type: [Debug, Release]
      solver_type: [RusanovGlobalAdaptiveFV, RusanovGlobalAdaptiveEnclaveFV, RusanovGlobalAdaptiveADERDG]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd applications/exahype2/euler/point-explosion; PYTHONPATH=$CI_PROJECT_DIR/python CCACHE_DIR=${CCACHE_DIR} python3 point-explosion.py -s $solver_type -d $dimensions -m $build_type;"
  needs:
    - job: Build
  dependencies:
    - Build
  retry: 1

