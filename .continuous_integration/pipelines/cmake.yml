include:
  - .continuous_integration/templates/tags.yml
  - .continuous_integration/templates/variables.yml
  - .continuous_integration/templates/before-script.yml
  - .continuous_integration/templates/run-only-on.yml
  - .continuous_integration/templates/mghype.yml
  - .continuous_integration/templates/exahype2.yml

stages:
  - Build
  - Test
  - Tutorials
  - Applications
  - Benchmarks

.BeforeScriptWithCMakeSanitiser:
  extends: .BeforeScript
  before_script:
    - python3 .continuous_integration/sanitise_path.py build/CTestTestfile.cmake build/CMakeCache.txt

.Build:
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} python3 -m compileall -f ./
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "mkdir build; cd build; CCACHE_DIR=${CCACHE_DIR} CC=${CC} CXX=${CXX} cmake .. -GNinja ${CONFIGURATION_OPTIONS} -DCMAKE_INSTALL_PREFIX=install"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd build; CCACHE_DIR=${CCACHE_DIR} ninja; ninja install"
    - mv build/src/unittests/CTestTestfile.cmake build/CTestTestfile.cmake
  artifacts:
    paths:
      - ./build/UnitTests*
      - ./build/CTestTestfile.cmake
      - ./install/*
    expire_in: 2 hours

.Unit_Tests:
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd build; ctest --no-compress-output --output-on-failure"

Build:
  stage: Build
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .BeforeScript
    - .Build
  retry: 0

Unit_Tests:
  stage: Test
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .BeforeScriptWithCMakeSanitiser
    - .Unit_Tests
  needs:
    - job: Build
  dependencies:
    - Build
  retry: 0

MGHyPE_Tests:
  stage: Test
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnlyOn
    - .BeforeScriptWithCMakeSanitiser
    - .MGHyPE_Tests
  needs:
    - job: Build
  dependencies:
    - Build
  retry: 0

