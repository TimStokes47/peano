.ExaHyPE2_Tutorials:
  parallel:
    matrix:
    - tutorial: [euler, acoustic, elastic, advection, swe]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tutorials/exahype2/toyproblems/$tutorial; CCACHE_DIR=${CCACHE_DIR} PYTHONPATH=$CI_PROJECT_DIR/python python3 $tutorial.py;"

.ExaHyPE2_Euler:
  parallel:
    matrix:
    - dimensions: [2, 3]
      build_type: [Debug, Release]
      solver_type: [RusanovGlobalAdaptiveFV, RusanovGlobalAdaptiveEnclaveFV, RusanovGlobalAdaptiveADERDG]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "mkdir build; cd build; CCACHE_DIR=${CCACHE_DIR} CC=${CC} CXX=${CXX} cmake .. ${CONFIGURATION_OPTIONS}"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd build/applications/exahype2/euler/point-explosion; PYTHONPATH=$CI_PROJECT_DIR/python CCACHE_DIR=${CCACHE_DIR} python3 point-explosion.py -s $solver_type -d $dimensions -m $build_type;"

