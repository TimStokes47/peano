intel-build:
  stage: build
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  script:
    - pwd
    - ls
    - whoami
    - hostname
    - echo $SINGULARITY_CACHEDIR
    - echo $CI_COMMIT_SHA
    - echo $CI_COMMIT_BRANCH
    - echo "Running CI with $(nproc) cores"
    - singularity exec --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} python3 configure.py --exahype --swift --petsc
    - singularity exec --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} make -j $(nproc --all)
  artifacts:
    paths:
      - ./*
    exclude:
      - ".git*"
      - ".git/**/*"
    expire_in: 2 hours
  retry: 0

intel-test:
  stage: test
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: intel-build
  script:
    - singularity exec --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} make check
  retry: 0

intel-tutorials:
  stage: tutorials
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: intel-build
  script:
    - singularity exec --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd tutorials/exahype2/euler; python3 euler.py'
    - singularity exec --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd tutorials/exahype2/euler; make -j'
  retry: 0

intel-applications:
  stage: applications
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: intel-build
  script:
    - singularity exec --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd applications/exahype2/euler; python3 euler.py --no-make --executable=euler'
    - singularity exec --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd applications/exahype2/euler; make -j'
  retry: 0

intel-benchmarks:
  stage: benchmarks
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: intel-build
  script:
    - singularity exec --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd benchmarks/exahype2/euler/kernel-benchmarks; python3 kernel-benchmarks-fv-rusanov.py --no-make --executable=kernel-benchmarks'
    - singularity exec --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd benchmarks/exahype2/euler/kernel-benchmarks; make -j'
    - singularity exec --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} benchmarks/exahype2/euler/kernel-benchmarks/kernel-benchmarks
  retry: 0
