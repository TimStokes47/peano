intel-build:
  stage: build
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  script:
    - pwd
    - ls
    - whoami
    - hostname
    - echo $SINGULARITY_CACHEDIR
    - echo $CI_COMMIT_SHA
    - echo $CI_COMMIT_BRANCH
    - echo "Running CI with $(nproc) cores"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} python3 -m compileall -f ./
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} python3 configure.py -cc=icx -cxx=icpx --exahype --swift --multithreading=omp
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} make -j $(nproc --all)
  artifacts:
    paths:
      - ./*
    exclude:
      - ".git*"
      - ".git/**/*"
    expire_in: 2 hours
  retry: 0

intel-test:
  stage: test
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: intel-build
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} make check
  retry: 0

intel-tutorials:
  stage: tutorials
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: intel-build
  parallel:
    matrix:
    - tutorial: [euler, acoustic-wave, elastic-wave, advection, swe]
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< "cd tutorials/exahype2/$tutorial; python3 $tutorial.py"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< "cd tutorials/exahype2/$tutorial; make -j $(nproc --all)"
  retry: 0

intel-applications:
  stage: applications
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: intel-build
  parallel:
    matrix:
    - dimensions: [2, 3]
      build_type: [Debug, Release]
      application: [euler, acoustic-wave, elastic-wave, advection, saint-venant]
      solver_type: [FVRusanovGlobalAdaptive, FVRusanovGlobalAdaptiveEnclave, RKDGRusanovGlobalAdaptive, RKDGRusanovGlobalAdaptiveEnclave, ADERDGRusanovGlobalAdaptive]
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< "cd applications/exahype2/$application; python3 $application.py -s $solver_type -d $dimensions -m $build_type"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< "cd applications/exahype2/$application; make -j $(nproc --all)"
  retry: 0

intel-benchmarks:
  stage: benchmarks
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: intel-build
  parallel:
    matrix:
    - benchmark: [euler, acoustic-wave, elastic-wave, advection]
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< "cd benchmarks/exahype2/$benchmark/kernel-benchmarks; python3 kernel-benchmarks-fv-rusanov.py -d 2 -ps 16 -p 128 -a -1 -m Release"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< "cd benchmarks/exahype2/$benchmark/kernel-benchmarks; make -j $(nproc --all)"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} benchmarks/exahype2/$benchmark/kernel-benchmarks/kernel-benchmarks-fv-rusanov-2d-ps-16-p-128-Release
  retry: 0
