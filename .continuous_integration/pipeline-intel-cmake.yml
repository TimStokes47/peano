build-cmake-intel:
  stage: build
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  script:
    - pwd
    - ls
    - whoami
    - hostname
    - echo $SINGULARITY_CACHEDIR
    - echo $CI_COMMIT_SHA
    - echo $CI_COMMIT_BRANCH
    - echo "Running CI with $(nproc) cores"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} python3 -m compileall -f ./
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} python3 configure.py -cc=icx -cxx=icpx --exahype --swift --multithreading=omp --cmake=build
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< "cd build; make -j $(nproc --all)"
  artifacts:
    paths:
      - ./build/*
    expire_in: 2 hours
  retry: 0

test-cmake-intel:
  stage: test
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: build-cmake-intel
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< "cd build; ctest --no-compress-output --output-on-failure"
  retry: 0

exahype2-tutorials-cmake-intel:
  stage: tutorials
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: build-cmake-intel
  parallel:
    matrix:
    - tutorial: [euler, acoustic-wave, elastic-wave, advection, swe]
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< "cd build/tutorials/exahype2/$tutorial; python3 $tutorial.py"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< "cd build/tutorials/exahype2/$tutorial; make -j $(nproc --all)"
  retry: 0

exahype2-applications-cmake-intel:
  stage: applications
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: build-cmake-intel
  parallel:
    matrix:
    - dimensions: [2, 3]
      build_type: [Debug, Release]
      application: [euler, elastic-wave]
      solver_type: [FVRusanovGlobalAdaptiveEnclave, RKDGRusanovGlobalAdaptiveEnclave, ADERDGRusanovGlobalAdaptive]
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< "cd build/applications/exahype2/$application; python3 $application.py -s $solver_type -d $dimensions -m $build_type"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< "cd build/applications/exahype2/$application; make -j $(nproc --all)"
  retry: 0

exahype2-benchmarks-cmake-intel:
  stage: benchmarks
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: build-cmake-intel
  parallel:
    matrix:
    - benchmark: [euler, acoustic-wave, elastic-wave, advection]
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< "cd build/benchmarks/exahype2/$benchmark/kernel-benchmarks; python3 kernel-benchmarks-fv-rusanov.py -d 2 -ps 16 -p 128 -a -1 -m Release"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< "cd build/benchmarks/exahype2/$benchmark/kernel-benchmarks; make -j $(nproc --all)"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} build/benchmarks/exahype2/$benchmark/kernel-benchmarks/kernel-benchmarks-fv-rusanov-2d-ps-16-p-128-Release
  retry: 0
