intel-build-cmake:
  stage: build
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  script:
    - pwd
    - ls
    - whoami
    - hostname
    - echo $SINGULARITY_CACHEDIR
    - echo $CI_COMMIT_SHA
    - echo $CI_COMMIT_BRANCH
    - echo "Running CI with $(nproc) cores"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} python3 configure.py -cc=icx -cxx=icpx --exahype --swift --multithreading=omp --cmake=build
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< ' cd build; make -j $(nproc --all)'
  artifacts:
    paths:
      - ./build/*
    expire_in: 2 hours
  retry: 0

intel-test-cmake:
  stage: test
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: intel-build-cmake
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< ' cd build; ctest --verbose'
  retry: 0

intel-tutorials-cmake:
  stage: tutorials
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: intel-build-cmake
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/tutorials/exahype2/euler; python3 euler.py'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/tutorials/exahype2/euler; make -j'

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/tutorials/exahype2/acoustic-wave; python3 acoustic-wave.py'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/tutorials/exahype2/acoustic-wave; make -j'

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/tutorials/exahype2/elastic-wave; python3 elastic-wave.py'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/tutorials/exahype2/elastic-wave; make -j'

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/tutorials/exahype2/advection; python3 advection.py'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/tutorials/exahype2/advection; make -j'
  retry: 0

intel-applications-cmake:
  stage: applications
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: intel-build-cmake
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/applications/exahype2/euler; python3 euler.py --no-make --executable=euler'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/applications/exahype2/euler; make -j'

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/applications/exahype2/acoustic-wave; python3 acoustic-wave.py --no-make --executable=acoustic-wave'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/applications/exahype2/acoustic-wave; make -j'

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/applications/exahype2/elastic-wave; python3 elastic-wave.py --no-make --executable=elastic-wave'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/applications/exahype2/elastic-wave; make -j'

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/applications/exahype2/advection; python3 advection.py --no-make --executable=advection'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/applications/exahype2/advection; make -j'

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/applications/exahype2/saint-venant; python3 saint-venant.py --no-make --executable=saint-venant'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/applications/exahype2/saint-venant; make -j'
  retry: 0

intel-benchmarks-cmake:
  stage: benchmarks
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: intel-build-cmake
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/benchmarks/exahype2/euler/kernel-benchmarks; python3 kernel-benchmarks-fv-rusanov.py -d 2 -ps 16 --no-make'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} bash <<< 'cd build/benchmarks/exahype2/euler/kernel-benchmarks; make -j'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${INTEL_IMAGE_TAG} build/benchmarks/exahype2/euler/kernel-benchmarks/kernel-benchmarks-fv-rusanov-2d-patch-size-16
  retry: 0
