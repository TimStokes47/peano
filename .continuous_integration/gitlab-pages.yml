include:
  - .continuous_integration/templates/tags.yml
  - .continuous_integration/templates/variables.yml
  - .continuous_integration/templates/before-script.yml

pages:
  extends:
    - .Tags
    - .Variables
    - .BeforeScript
  stage: Pages
  allow_failure: false
  dependencies: []
  script:
    - apptainer exec -e --bind "$PWD" $APPTAINER_IMAGEDIR/${IMAGE_TAG_BASE} python3 documentation/convert-jupyter-notebooks.py
    - apptainer exec -e --bind "$PWD" $APPTAINER_IMAGEDIR/${IMAGE_TAG_BASE} doxygen documentation/Doxyfile
    - rm -rf public
    - mkdir public
    - mv ./doxygen-html/html/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "p4"'
  when: always
  retry: 0
