.ExaHyPE2_ADER_DG_Tests:
  parallel:
    matrix:
    - scenario: [AcousticPlanarWaves, AdvectionLinear, ElasticPlanarWaves, EulerGaussianBell, EulerIsotropicVortex, SWERadialDamBreak, SWERestingLake]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/exahype2/aderdg; PYTHONPATH=$CI_PROJECT_DIR/python python3 aderdg.py -s $scenario;"

.ExaHyPE2_ADER_DG_AMR_SWE_Test:
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/exahype2/aderdg-amr-swe; PYTHONPATH=$CI_PROJECT_DIR/python python3 aderdg-amr-swe.py; OMP_NUM_THREADS=1 ./ADER-DG-AMR-SWE > ADER-DG-AMR-SWE.out"
  artifacts:
    paths:
      - tests/exahype2/aderdg-amr-swe/ADER-DG-AMR-SWE.out
    expire_in: 2 hours

