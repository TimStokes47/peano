.ExaHyPE2_Tutorials_Exercises:
  parallel:
    matrix:
    - tutorial: [Acoustic-vanilla, Acoustic-advanced, SWE-sympy]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tutorials/exahype2/exercises; PYTHONPATH=$CI_PROJECT_DIR/python ipython3 $tutorial.ipynb;"

.ExaHyPE2_Tutorials_Toyproblems:
  parallel:
    matrix:
    - tutorial: [euler, acoustic, elastic, advection, swe]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tutorials/exahype2/toyproblems/$tutorial; PYTHONPATH=$CI_PROJECT_DIR/python python3 $tutorial.py;"

.ExaHyPE2_Euler:
  parallel:
    matrix:
    - dimensions: [2, 3]
      build_type: [Debug, Release]
      solver_type: [RusanovGlobalFixedFV, RusanovGlobalFixedEnclaveFV, RusanovGlobalAdaptiveFV, RusanovGlobalAdaptiveEnclaveFV, RusanovGlobalFixedADERDG, RusanovGlobalAdaptiveADERDG]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd applications/exahype2/euler/point-explosion; PYTHONPATH=$CI_PROJECT_DIR/python python3 point-explosion.py -s $solver_type -d $dimensions -m $build_type;"

.ExaHyPE2_Acoustic:
  parallel:
    matrix:
    - dimensions: [2, 3]
      build_type: [Debug, Release]
      solver_type: [RusanovGlobalFixedFV, RusanovGlobalFixedEnclaveFV, RusanovGlobalAdaptiveFV, RusanovGlobalAdaptiveEnclaveFV, RusanovGlobalFixedADERDG, RusanovGlobalAdaptiveADERDG]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd applications/exahype2/acoustic/point-explosion; PYTHONPATH=$CI_PROJECT_DIR/python python3 point-explosion.py -s $solver_type -d $dimensions -m $build_type;"

.ExaHyPE2_Elastic:
  parallel:
    matrix:
    - dimensions: [2, 3]
      build_type: [Debug, Release]
      solver_type: [RusanovGlobalFixedFV, RusanovGlobalFixedEnclaveFV, RusanovGlobalAdaptiveFV, RusanovGlobalAdaptiveEnclaveFV, RusanovGlobalFixedADERDG, RusanovGlobalAdaptiveADERDG]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd applications/exahype2/elastic/point-explosion; PYTHONPATH=$CI_PROJECT_DIR/python python3 point-explosion.py -s $solver_type -d $dimensions -m $build_type;"

.ExaHyPE2_ShallowWater:
  parallel:
    matrix:
    - scenario: [circular-island, dam-break-landslide, oscillating-lake, radial-dam-break, three-mounds-channel]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd applications/exahype2/shallow-water/$scenario; PYTHONPATH=$CI_PROJECT_DIR/python python3 $scenario.py;"

.ExaHyPE2_Kernels:
  parallel:
    matrix:
    - kernel: [euler, acoustic, elastic]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd benchmarks/exahype2/$kernel/kernel-benchmarks; PYTHONPATH=$CI_PROJECT_DIR/python python3 kernel-benchmarks-fv-rusanov-dsl.py -e -m Release"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd benchmarks/exahype2/$kernel/kernel-benchmarks; ./KernelBenchmarksFVRusanovDSL.Release"

.ExaHyPE2_SBH:
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd benchmarks/exahype2/ccz4/single-black-hole; PYTHONPATH=$PYTHONPATH:$CI_PROJECT_DIR/python:$CI_PROJECT_DIR/applications/exahype2/ccz4:$CI_PROJECT_DIR/src python3 performance-studies.py -s fv-6 -et 1e-4 --trees 32 --scheduler native --plot 0.0 --cell-size 1.8 --output sbh"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd benchmarks/exahype2/ccz4/single-black-hole; ./sbh"

