.MGHyPE_MatrixFree_Tests:
  parallel:
    matrix:
    - test: [dg, dg-with-smart-pointers, dg-tasking, dg-without-fusion, dg-with-fusion-unshifted, dg-two-grid, dg-two-grid-h-coarsen, cg, cg-multigrid, cg-multigrid-single-threaded]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/multigrid/matrixfree/poisson/; PYTHONPATH=$PYTHONPATH:$CI_PROJECT_DIR/python:$CI_PROJECT_DIR/src python3 $test.py -m release; ./peano4matrixfree"
