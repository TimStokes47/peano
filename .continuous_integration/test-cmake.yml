test-cmake:
  stage: test
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: build-cmake
  parallel:
    matrix:
    - image_tag: [gcc_latest.sif, intel_latest.sif, llvm_latest.sif, nvidia_latest.sif]
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/$image_tag bash <<< "cd build; ctest --no-compress-output --output-on-failure"
  retry: 0
