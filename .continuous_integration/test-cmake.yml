test-cmake:
  extends: .images
  stage: test
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: build-cmake
      parallel: !reference [.images, parallel]
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/$IMAGE_TAG bash <<< "cd build; ctest --no-compress-output --output-on-failure"
  retry: 0
