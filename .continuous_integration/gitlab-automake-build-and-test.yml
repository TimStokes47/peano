include:
  - .continuous_integration/gitlab-templates.yml

stages:
  - Build
  - Test
  - Tutorials
  - Applications
  - Benchmarks

Build:
  extends: .BeforeScript
  stage: Build
  allow_failure: false
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} python3 -m compileall -f ./
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "libtoolize; aclocal; autoconf; autoheader; cp src/config.h.in .; automake --add-missing;"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "CFLAGS=\"${CFLAGS}\" CC=${CC} CXXFLAGS=\"${CXXFLAGS}\" CXX=${CXX} LDFLAGS=\"${LDFLAGS}\" ./configure ${CONFIGURATION_OPTIONS}"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} make -j $(nproc --all)
  artifacts:
    paths:
      - ./*
    exclude:
      - ".git*"
      - ".git/**/*"
    expire_in: 2 hours
  retry: 1

UnitTests:
  extends:
    - .BeforeScript
    - .SanitiseAutomake
  stage: Test
  allow_failure: false
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} make check
  needs:
    - job: Build
  dependencies:
    - Build
  retry: 1

ExaHyPE2:
  extends:
    - .BeforeScript
    - .SanitiseAutomake
    - .RunOnlyOnDevelopmentBranches
  stage: Tutorials
  allow_failure: false
  parallel:
    matrix:
    - tutorial: [euler, acoustic, elastic, advection, swe]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tutorials/exahype2/toyproblems/$tutorial; PYTHONPATH=$CI_PROJECT_DIR/python python3 $tutorial.py"
  needs:
    - job: Build
  dependencies:
    - Build
  retry: 1

ExaHyPE2_Euler:
  extends:
    - .BeforeScript
    - .SanitiseAutomake
    - .RunOnlyOnDevelopmentBranches
  stage: Applications
  allow_failure: false
  parallel:
    matrix:
    - dimensions: [2, 3]
      build_type: [Debug, Release]
      solver_type: [RusanovGlobalAdaptiveEnclaveFV, RusanovGlobalAdaptiveEnclaveRKDG, RusanovGlobalAdaptiveADERDG]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd applications/exahype2/point-explosion/euler; PYTHONPATH=$CI_PROJECT_DIR/python python3 point-explosion.py -s $solver_type -d $dimensions -m $build_type"
  needs:
    - job: Build
  dependencies:
    - Build
  retry: 1

