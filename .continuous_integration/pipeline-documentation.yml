pages:
  stage: publish
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  dependencies: []
  before_script:
    - module load singularity/3.9.2
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_IMAGEDIR/${BASE_IMAGE_TAG} doxygen documentation/Doxyfile
    - mkdir public
    - mv ./doxygen-html/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "p4"'
  when: always
  retry: 0
