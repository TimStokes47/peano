documentation:
  stage: publish
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  dependencies: []
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${GCC_IMAGE_TAG} doxygen documentation/Doxyfile
  artifacts:
    paths:
      - ./doxygen-html/*
  retry: 0

pages:
  stage: publish
  script:
    #make public directory. This will be visible to outside world
    - mkdir public
    #copy the doxygen stuff into it
    - cp -r doxygen-html/* public/
  artifacts:
    paths:
      - public