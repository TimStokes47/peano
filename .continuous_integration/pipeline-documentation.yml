documentation:
  stage: publish
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${LATEX_IMAGE_TAG} doxygen documentation/Doxyfile
  artifacts:
    paths:
      - ./doxygen-html/*
  when: always
  retry: 0

pages:
  stage: deploy
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  script:
    - mkdir public
    - cp -r ./doxygen-html/* public/
  needs:
    - job: documentation
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "p4"'
  when: always
