# To avoid having to repeat hard links to e.g. the containers everywhere, we make them
# available with this include statement
include:
  - .continuous_integration/templates/variables.yml


# This file is included from the top-level gitlab-ci file, meaning that this stage is a sub-stage of the
# main BuildSystem job.
stages:
  - Compiler

########################################################
# Define one sub-pipeline per toolchain:
########################################################

GCC_OpenMP:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "gcc"
    CXX: "g++"
    IMAGE_TAG: "${IMAGE_TAG_GCC}"
    CONFIGURATION_OPTIONS: "-DUSE_CCACHE=OFF \
                            -DENABLE_EXAHYPE=ON \
                            -DENABLE_LOADBALANCING=ON \
                            -DENABLE_BLOCKSTRUCTURED=ON \
                            -DENABLE_SWIFT=ON \
                            -DENABLE_PARTICLES=ON \
                            -DENABLE_MGHYPE=ON \
                            -DENABLE_FINITEELEMENTS=ON \
                            -DWITH_MULTITHREADING=omp"
  trigger:
    include:
      - .continuous_integration/pipelines/cmake.yml
    strategy: depend

