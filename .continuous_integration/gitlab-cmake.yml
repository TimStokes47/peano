include:
  - .continuous_integration/gitlab-templates.yml

stages:
  - Compiler

GCC_OpenMP:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "gcc"
    CXX: "g++"
    IMAGE_TAG: "${IMAGE_TAG_GCC}"
    CONFIGURATION_OPTIONS: "-DENABLE_EXAHYPE=ON \
                            -DENABLE_LOADBALANCING=ON \
                            -DENABLE_BLOCKSTRUCTURED=ON \
                            -DENABLE_SWIFT=ON \
                            -DENABLE_PARTICLES=ON \
                            -DENABLE_MGHYPE=ON \
                            -DENABLE_FINITEELEMENTS=ON \
                            -DWITH_MULTITHREADING=omp"
  trigger:
    include:
      - .continuous_integration/gitlab-cmake-pipeline.yml
    strategy: depend

Intel_OpenMP:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "icx"
    CXX: "icpx"
    IMAGE_TAG: "${IMAGE_TAG_INTEL}"
    CONFIGURATION_OPTIONS: "-DENABLE_EXAHYPE=ON \
                            -DENABLE_LOADBALANCING=ON \
                            -DENABLE_BLOCKSTRUCTURED=ON \
                            -DENABLE_SWIFT=ON \
                            -DENABLE_PARTICLES=ON \
                            -DENABLE_MGHYPE=ON \
                            -DENABLE_FINITEELEMENTS=ON \
                            -DWITH_MULTITHREADING=omp"
  trigger:
    include:
      - .continuous_integration/gitlab-cmake-pipeline.yml
    strategy: depend

LLVM_OpenMP:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "clang"
    CXX: "clang++"
    IMAGE_TAG: "${IMAGE_TAG_LLVM}"
    CONFIGURATION_OPTIONS: "-DENABLE_EXAHYPE=ON \
                            -DENABLE_LOADBALANCING=ON \
                            -DENABLE_BLOCKSTRUCTURED=ON \
                            -DENABLE_SWIFT=ON \
                            -DENABLE_PARTICLES=ON \
                            -DENABLE_MGHYPE=ON \
                            -DENABLE_FINITEELEMENTS=ON \
                            -DWITH_MULTITHREADING=omp"
  trigger:
    include:
      - .continuous_integration/gitlab-cmake-pipeline.yml
    strategy: depend

NVIDIA:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "nvc"
    CXX: "nvc++"
    IMAGE_TAG: "${IMAGE_TAG_NVIDIA}"
    CONFIGURATION_OPTIONS: "-DENABLE_EXAHYPE=ON \
                            -DENABLE_LOADBALANCING=ON \
                            -DENABLE_BLOCKSTRUCTURED=ON \
                            -DENABLE_SWIFT=ON \
                            -DENABLE_MGHYPE=OFF \
                            -DENABLE_FINITEELEMENTS=ON \
                            -DENABLE_PARTICLES=ON"
  trigger:
    include:
      - .continuous_integration/gitlab-cmake-pipeline.yml
    strategy: depend
