build:
  extends: .images
  stage: build
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  script:
    - pwd
    - ls
    - whoami
    - hostname
    - echo $IMAGE_TAG
    - echo $SINGULARITY_CACHEDIR
    - echo $CI_COMMIT_SHA
    - echo $CI_COMMIT_BRANCH
    - echo "Running CI with $(nproc) cores"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/$IMAGE_TAG python3 -m compileall -f ./
    - if [ "$IMAGE_TAG" = amd_latest.sif ]; then singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/$IMAGE_TAG python3 configure.py -cc=amdclang -cxx=amdclang++ --exahype --swift --multithreading=omp; fi;
    - if [ "$IMAGE_TAG" = gcc_latest.sif ]; then singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/$IMAGE_TAG python3 configure.py -cc=gcc -cxx=g++ --exahype --swift --multithreading=omp; fi;
    - if [ "$IMAGE_TAG" = intel_latest.sif ]; then singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/$IMAGE_TAG python3 configure.py -cc=icx -cxx=icpx --exahype --swift --multithreading=omp; fi;
    - if [ "$IMAGE_TAG" = llvm_latest.sif ]; then singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/$IMAGE_TAG python3 configure.py -cc=clang -cxx=clang++ --exahype --swift --multithreading=omp; fi;
    - if [ "$IMAGE_TAG" = nvidia_latest.sif ]; then singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/$IMAGE_TAG python3 configure.py -cc=nvc -cxx=nvc++ --exahype --swift --multithreading=omp; fi;
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/$IMAGE_TAG bash <<< "cd build; make -j $(nproc --all)"
  artifacts:
    paths:
      - ./*
    exclude:
      - ".git*"
      - ".git/**/*"
    expire_in: 2 hours
  retry: 0
