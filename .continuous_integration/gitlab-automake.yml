# To avoid having to repeat hard links to e.g. the containers everywhere, we make them
# available with this include statement
include:
  - .continuous_integration/templates/variables.yml

# This file is included from the top-level gitlab-ci file, meaning that this stage is a sub-stage of the
# main BuildSystem job.
stages:
  - Compiler

########################################################
# Define one sub-pipeline per toolchain:
########################################################

GCC_OpenMP:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "gcc"
    CXX: "g++"
    CFLAGS: ""
    CXXFLAGS: "-O3 -std=c++20 -w -fopenmp"
    LDFLAGS: "-fopenmp"
    IMAGE_TAG: "${IMAGE_GCC}"
    CONFIGURATION_OPTIONS: "--enable-exahype \
                            --enable-loadbalancing \
                            --enable-blockstructured \
                            --enable-swift \
                            --enable-particles \
                            --enable-mghype \
                            --enable-finiteelements \
                            --with-multithreading=omp"
  trigger:
    include:
      - .continuous_integration/pipelines/automake.yml
    strategy: depend

