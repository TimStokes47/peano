include:
  - .continuous_integration/gitlab-templates.yml

stages:
  - Compiler

GCC_OpenMP:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "gcc"
    CXX: "g++"
    CFLAGS: "-O3 -fopenmp"
    CXXFLAGS: "-O3 -std=c++20 -w"
    LDFLAGS: "-fopenmp"
    IMAGE_TAG: "${IMAGE_TAG_GCC}"
    CONFIGURATION_OPTIONS: "--enable-exahype \
                            --enable-loadbalancing \
                            --enable-blockstructured \
                            --enable-swift \
                            --enable-particles \
                            --with-multithreading=omp"
  trigger:
    include:
      - .continuous_integration/gitlab-automake-build-and-test.yml
    strategy: depend

