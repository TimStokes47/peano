nvidia-build-cmake:
  stage: build
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  script:
    - pwd
    - ls
    - whoami
    - hostname
    - echo $SINGULARITY_CACHEDIR
    - echo $CI_COMMIT_SHA
    - echo $CI_COMMIT_BRANCH
    - echo "Running CI with $(nproc) cores"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} python3 -m compileall -f ./
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} python3 configure.py -cc=nvc -cxx=nvc++ --exahype --swift --multithreading=omp --cmake=build
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build; make -j $(nproc --all)'
  artifacts:
    paths:
      - ./build/*
    expire_in: 2 hours
  retry: 0

nvidia-test-cmake:
  stage: test
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: nvidia-build-cmake
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build; ctest --no-compress-output --output-on-failure'
  retry: 0

nvidia-tutorials-cmake:
  stage: tutorials
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: nvidia-build-cmake
  parallel:
    matrix:
    - tutorial: [euler, acoustic-wave, elastic-wave, advection, swe]
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build/tutorials/exahype2/$tutorial; python3 $tutorial.py'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build/tutorials/exahype2/$tutorial; make -j $(nproc --all)'
  retry: 0

nvidia-applications-cmake:
  stage: applications
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: nvidia-build-cmake
  parallel:
    matrix:
    - dimensions: [2, 3]
      build_type: [Debug, Release]
      application: [euler, acoustic-wave, elastic-wave, advection, saint-venant]
      solver_type: [FVRusanovGlobalAdaptive, FVRusanovGlobalAdaptiveEnclave, RKDGRusanovGlobalAdaptive, RKDGRusanovGlobalAdaptiveEnclave, ADERDGRusanovGlobalAdaptive]
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build/applications/exahype2/$application; python3 $application.py -s $solver_type -d $dimensions -m $build_type'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build/applications/exahype2/$application; make -j $(nproc --all)'
  retry: 0

nvidia-benchmarks-cmake:
  stage: benchmarks
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: nvidia-build-cmake
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build/benchmarks/exahype2/euler/kernel-benchmarks; python3 kernel-benchmarks-fv-rusanov.py -d 2 -ps 16 -p 128 -a -1 -m Release'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build/benchmarks/exahype2/euler/kernel-benchmarks; make -j $(nproc --all)'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} build/benchmarks/exahype2/euler/kernel-benchmarks/kernel-benchmarks-fv-rusanov-2d-ps-16-p-128-Release

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build/benchmarks/exahype2/advection/kernel-benchmarks; python3 kernel-benchmarks-fv-rusanov.py -d 2 -ps 16 -p 128 -a -1 -m Release'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build/benchmarks/exahype2/advection/kernel-benchmarks; make -j $(nproc --all)'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} build/benchmarks/exahype2/advection/kernel-benchmarks/kernel-benchmarks-fv-rusanov-2d-ps-16-p-128-Release

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build/benchmarks/exahype2/acoustic-wave/kernel-benchmarks; python3 kernel-benchmarks-fv-rusanov.py -d 2 -ps 16 -p 128 -a -1 -m Release'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build/benchmarks/exahype2/acoustic-wave/kernel-benchmarks; make -j $(nproc --all)'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} build/benchmarks/exahype2/acoustic-wave/kernel-benchmarks/kernel-benchmarks-fv-rusanov-2d-ps-16-p-128-Release

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build/benchmarks/exahype2/elastic-wave/kernel-benchmarks; python3 kernel-benchmarks-fv-rusanov.py -d 2 -ps 16 -p 128 -a -1 -m Release'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build/benchmarks/exahype2/elastic-wave/kernel-benchmarks; make -j $(nproc --all)'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} build/benchmarks/exahype2/elastic-wave/kernel-benchmarks/kernel-benchmarks-fv-rusanov-2d-ps-16-p-128-Release

    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build/benchmarks/exahype2/ccz4/kernel-benchmarks; python3 kernel-benchmarks-fv-rusanov.py -ps 4 -p 128 -a -1 -m Release'
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< 'cd build/benchmarks/exahype2/ccz4/kernel-benchmarks; make -j $(nproc --all)'
  retry: 0
