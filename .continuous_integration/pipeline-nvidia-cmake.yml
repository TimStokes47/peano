nvidia-build-cmake:
  stage: build
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  script:
    - pwd
    - ls
    - whoami
    - hostname
    - echo $SINGULARITY_CACHEDIR
    - echo $CI_COMMIT_SHA
    - echo $CI_COMMIT_BRANCH
    - echo "Running CI with $(nproc) cores"
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} python3 -m compileall -f ./
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} python3 configure.py -cc=nvc -cxx=nvc++ --exahype --swift --multithreading=omp --cmake=build
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< ' cd build; make -j $(nproc --all)'
  artifacts:
    paths:
      - ./build/*
    expire_in: 2 hours
  retry: 0

nvidia-test-cmake:
  stage: test
  allow_failure: false
  tags:
    - ${RUNNER_TAG}
  needs:
    - job: nvidia-build-cmake
  script:
    - singularity exec -e --bind "$PWD" $SINGULARITY_CACHEDIR/${NVIDIA_IMAGE_TAG} bash <<< ' cd build; ctest --no-compress-output --output-on-failure'
  retry: 0

nvidia-tutorials-cmake:
