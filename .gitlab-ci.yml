variables:
  RUNNER_TAG: "peano-dine-runner"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "p4"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "DG"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "exahype"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "gpus"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "multigrid"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "applications"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "particles"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "ccz4-cpp"'

stages:
  - build
  - test
  - tutorials
  - applications
  - benchmarks
  - formatting
  - publish
  - deploy

include:
  - .continuous_integration/build.yml
  - .continuous_integration/build-cmake.yml

  - .continuous_integration/test.yml
  - .continuous_integration/test-cmake.yml

  - .continuous_integration/exahype-tutorials.yml
  - .continuous_integration/exahype-tutorials-cmake.yml

  - .continuous_integration/exahype-applications.yml
  - .continuous_integration/exahype-applications-cmake.yml

  - .continuous_integration/exahype-benchmarks.yml
  - .continuous_integration/exahype-benchmarks-cmake.yml

  - .continuous_integration/formatting.yml
  - .continuous_integration/documentation.yml
