[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "Peano"
version = "4.0.0"
authors = [
  { name="Tobias Weinzierl", email="tobias.weinzierl@durham.ac.uk" },
  { name="Sean Baccas" },
  { name="Dominic Etienne Charrier" },
  { name="Jonathan Frawley" },
  { name="Yashas Gandhi" },
  { name="Uzmar Gomez" },
  { name="Mladen Ivkovic" },
  { name="Lando Jahn" },
  { name="Marc Marot-Lassauzaie" },
  { name="Chung M. Loi" },
  { name="Daniel Nagy" },
  { name="Dmitry Nikolaenko" },
  { name="Pawel Radtke" },
  { name="Anne Reinarz" },
  { name="Holger Schulz" },
  { name="Adam Tuft" },
  { name="Mark Turner" },
  { name="Mario Wille" },
  { name="Marion Weinzierl" },
  { name="Florian Wunderlich" },
  { name="Budanaz Yakup" },
  { name="Han Zhang" },
]
description = "Peano Python API"
readme="README"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    "Jinja2",
    "numpy",
    "sympy",
    "matplotlib",
    "h5py",
    "scipy",
    "mpmath",
    "VTUinterface",
]

[project.urls]
"Homepage" = "http://www.peano-framework.org"

[tool.setuptools]
packages=[
    "dastgen2",
    "exahype2",
    "multigrid",
    "peano4",
    "petsc",
    "swift2",
]
