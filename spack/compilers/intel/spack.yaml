spack:
  specs:
    - python@3.13.0 %gcc
    - py-pip@24.3.1 %gcc
    - intel-oneapi-compilers@2025.0.4 +amd +nvidia %gcc
    - intel-oneapi-mpi@2021.14.1 %gcc
    - intel-oneapi-mkl@2024.2.2 %gcc
    - libxsmm@1.17 +generator %gcc
    - easi@1.5.0 %gcc
    - memkind@1.14.0 %gcc
    - openblas@0.3.28 %gcc
    - eigen@3.4.0 %gcc
    - papi@7.1.0 %gcc
    - likwid@5.4.1 +cuda %gcc
    - metis@5.1.0 %gcc
    - parmetis@4.0.3 %gcc
    - petsc@3.22.2 +mpi +memkind +metis +hwloc +openmp %gcc
    - hdf5@1.14.5 -fortran -java +threadsafe +mpi +shared +cxx +hl %gcc
    - netcdf-c@4.9.2 +mpi +shared %gcc
    - netcdf-cxx4@4.3.1 +pic +shared %gcc
    - parallel-netcdf@1.14.0 +cxx -fortran +pic +shared %gcc
  packages:
    all:
      target: [x86_64]
  concretizer:
    unify: true
    reuse: true
  config:
    install_tree: /opt/software
  view: /opt/views/view
