spack:
  definitions:
  - packages: [
      m4,
      xz,
      git,
      perl,
      patchelf,
      libtool,
      diffutils,
      pkgconf,
      autoconf,
      automake,
      gmake,
      cmake,
      ninja,
      py-pip,
      py-black,
      py-sympy,
      py-scipy,
      py-numpy,
      py-mpmath,
      py-jinja2,
      py-jsonschema,
      py-jupyterlab,
      py-matplotlib,
      gsl,
      mesa,
      btop,
      htop,
      nvtop,
      libxsmm+generator,
      memkind,
      blis,
      boost,
      openblas,
      eigen+ipo,
      papi,
      likwid+cuda,
      hwloc+cuda,
      ucx+cuda,
      openmpi+cuda fabrics=ucx,
      babelstream+cuda cuda_arch=70,
      parmetis+int64+shared+ipo,
      metis+int64+real64+ipo+shared,
      hdf5+fortran+threadsafe+mpi+shared,
      netcdf-c+mpi+shared,
      netcdf-cxx4+pic+shared,
      netcdf-fortran+pic+shared,
      parallel-netcdf+cxx+fortran+pic+shared,
      petsc+mpi+memkind+metis+cuda+hwloc+openmp,
      paraview+mpi+ipo+python+hdf5 ^llvm ~clang ~flang ~lldb ~lld libcxx=none ~gold +llvm_dylib
    ]
  packages:
    all:
      target: [x86_64]
      compiler: [nvhpc@24.7]
  specs:
  - nvhpc@24.7
  - matrix:
    - [$packages]
    #- ['nvhpc@24.7']
  concretizer:
    unify: true
  config:
    install_tree: /opt/software
    install_missing_compilers: true
  view: /opt/views/view
